{% extends "base/layout.html" %}

{% block content %}
    <h2>Verify Registration Code</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Enter your 6-digit code:</label>
        <input type="text" name="code" maxlength="6" required>
        <button type="submit">Verify</button>
    </form>
{% endblock %}
